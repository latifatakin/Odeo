    <header class="mobile-brand">
      <a class="nav-logo" href="#/home" aria-label="Ôdēō home">
        <svg class="logo-full" aria-hidden="true" focusable="false"><use href="#odeo-logo" /></svg>
      </a>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <div class="offline-banner" id="offline-banner" role="status" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-wifi-off" /></svg>
      <span>You’re offline. Your library still plays with voices on this device.</span>
    </div>

    <div id="announcer-polite" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="announcer-assertive" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
    <div class="toasts" id="toasts"></div>

    <dialog id="add-dialog" class="sheet" aria-labelledby="add-title">
      <div class="sheet-grab" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 class="h4" id="add-title">Add something to listen to</h2>
        <button type="button" class="close-btn sheet-close" aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
        </button>
      </div>
      <div class="sheet-body">
        <div class="add-tiles" data-add-tiles></div>
      </div>
    </dialog>

    <dialog id="reading-dialog" class="sheet" aria-labelledby="reading-title">
      <div class="sheet-grab" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 class="h4" id="reading-title">Reading settings</h2>
        <button type="button" class="close-btn sheet-close" aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
        </button>
      </div>
      <div class="sheet-body" data-reading-settings></div>
    </dialog>

    <dialog id="confirm-dialog" class="sheet sheet--confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <form method="dialog">
        <div class="sheet-head"><h2 class="h4" id="confirm-title"></h2></div>
        <div class="sheet-body"><p id="confirm-body"></p></div>
        <div class="sheet-foot">
          <button type="submit" class="btn btn--secondary" value="cancel" autofocus>Keep it</button>
          <button type="submit" class="btn btn--danger" value="confirm" id="confirm-ok">Delete</button>
        </div>
      </form>
    </dialog>

    <input type="file" id="global-file" accept=".pdf,.txt,application/pdf,text/plain" hidden />

    <noscript>
      <p class="noscript">Ôdēō needs JavaScript to read text aloud. Please turn it on and reload the page.</p>
    </noscript>

    <script type="module" src="js/main.js"></script>
