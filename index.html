<!doctype html>
<html lang="en" data-font="opendyslexic" data-reading="basic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ôdēō — Text to speech</title>
    <meta name="description" content="Ôdēō turns any text, PDF or TXT file into speech, with word-by-word highlighting and dyslexia-friendly reading settings." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121019" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <link rel="preload" href="fonts/OpenDyslexic-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/reader.css" />
    <script src="js/theme-boot.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
      <symbol id="i-logo" viewBox="0 0 24 24"><path d="M5 14v4M10 9v9M15 5v13M20 11v7" /></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8.5a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19.5z" /></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><rect x="3.5" y="4" width="4" height="16" rx="1" /><rect x="9.5" y="4" width="4" height="16" rx="1" /><path d="M15.6 5.3l3.6-1 3.3 14.4-3.6 1z" /><path d="M3.5 16h4M9.5 16h4" /></symbol>
      <symbol id="i-aa" viewBox="0 0 24 24"><path d="M2.5 18l3.5-9 3.5 9M3.8 14.8h4.4" /><path d="M11 18l5-13 5 13M12.9 13.2h6.2" /></symbol>
      <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5" /><circle cx="9" cy="9" r="1.2" fill="currentColor" stroke="none" /><circle cx="15" cy="15" r="1.2" fill="currentColor" stroke="none" /><circle cx="15" cy="9" r="1.2" fill="currentColor" stroke="none" /><circle cx="9" cy="15" r="1.2" fill="currentColor" stroke="none" /><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none" /></symbol>
      <symbol id="i-notes" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" /><path d="M15 3v4h4M9 12h6M9 16h6M9 8h2" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z" fill="currentColor" stroke="none" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none" /><rect x="13.5" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none" /></symbol>
      <symbol id="i-back10" viewBox="0 0 24 24"><path d="M4.5 9.5A8 8 0 1 1 4 12" /><path d="M4 4.5v5h5" /><text x="12.4" y="15.6" font-size="7.4" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">10</text></symbol>
      <symbol id="i-fwd10" viewBox="0 0 24 24"><path d="M19.5 9.5A8 8 0 1 0 20 12" /><path d="M20 4.5v5h-5" /><text x="11.6" y="15.6" font-size="7.4" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">10</text></symbol>
      <symbol id="i-note-plus" viewBox="0 0 24 24"><path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M15 3v5h5M12 11v6M9 14h6" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4-4" /></symbol>
      <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 12.5a10 10 0 0 1 4.2-2.4M19 12.5a10 10 0 0 0-2.8-1.9M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 11 5M12 20h.01" /></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" /><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7a2 2 0 0 1 2-2H10l2 2.5h6.5a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" /></symbol>
      <symbol id="i-type" viewBox="0 0 24 24"><path d="M5 6V4.5h14V6M12 4.5v15M9 19.5h6" /></symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2" /><path d="M9 5V3.5h6V5M9 11h6M9 15h4" /></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" /><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></symbol>
      <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0" /><path d="M12 16l4-5" /><path d="M3 20h18" /></symbol>
    </svg>

    <header class="appbar" id="appbar">
      <a class="brand" href="#/home" aria-label="Ôdēō home">
        <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#i-logo" /></svg></span>
        <span class="brand-name">Ôdēō</span>
      </a>
      <nav class="tabs" aria-label="Main">
        <a href="#/home" data-route="home">Home</a>
        <a href="#/library" data-route="library">Library</a>
        <a href="#/notes" data-route="notes">Notes</a>
      </nav>
      <div class="appbar-actions">
        <button type="button" class="btn btn--primary btn--sm add-open" aria-haspopup="dialog">
          <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg><span class="add-label">New</span>
        </button>
        <button type="button" class="aa-btn appearance-open" aria-label="Appearance" aria-haspopup="dialog">Aa</button>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Main">
      <a href="#/home" data-route="home"><svg class="icon" aria-hidden="true"><use href="#i-home" /></svg><span>Home</span></a>
      <a href="#/library" data-route="library"><svg class="icon" aria-hidden="true"><use href="#i-library" /></svg><span>Library</span></a>
      <button type="button" class="tabbar-add add-open" aria-label="Add something to listen to" aria-haspopup="dialog">
        <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
      </button>
      <a href="#/notes" data-route="notes"><svg class="icon" aria-hidden="true"><use href="#i-notes" /></svg><span>Notes</span></a>
      <button type="button" class="appearance-open tabbar-aa" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-aa" /></svg><span>Display</span></button>
    </nav>

    <div class="offline-banner" id="offline-banner" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-wifi-off" /></svg>
      <span>Offline. Your library still plays with on-device voices.</span>
    </div>

    <div id="announcer-polite" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="announcer-assertive" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
    <div class="toasts" id="toasts"></div>

    <!-- Add something -->
    <dialog id="add-dialog" class="sheet" aria-labelledby="add-title">
      <div class="sheet-head">
        <h2 id="add-title">What are we listening to?</h2>
        <button type="button" class="icon-btn sheet-close" aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
        </button>
      </div>
      <div class="sheet-body">
        <div class="import-grid" data-import-grid></div>
      </div>
    </dialog>

    <!-- Appearance -->
    <dialog id="appearance-dialog" class="sheet sheet--panel" aria-labelledby="appearance-title">
      <form method="dialog" id="appearance-form">
        <div class="sheet-head">
          <h2 id="appearance-title">Appearance</h2>
          <button type="submit" class="icon-btn" aria-label="Close appearance">
            <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
          </button>
        </div>
        <div class="sheet-body settings-stack">
          <div class="setting-row">
            <span class="setting-label" id="size-label">Text size</span>
            <div class="stepper" role="group" aria-labelledby="size-label">
              <button type="button" class="stepper-btn" data-step="fontSize" data-dir="-1" aria-label="Smaller text"><span class="a-small" aria-hidden="true">A</span></button>
              <output id="size-out" aria-live="polite">100%</output>
              <button type="button" class="stepper-btn" data-step="fontSize" data-dir="1" aria-label="Larger text"><span class="a-large" aria-hidden="true">A</span></button>
            </div>
          </div>

          <fieldset class="setting-group">
            <legend>Page colour</legend>
            <div class="swatches">
              <label class="swatch swatch--basic"><input type="radio" name="readingTheme" value="basic" /><span><svg class="icon" aria-hidden="true"><use href="#i-file" /></svg>Basic</span></label>
              <label class="swatch swatch--warm"><input type="radio" name="readingTheme" value="warm" /><span><svg class="icon" aria-hidden="true"><use href="#i-sun" /></svg>Warm</span></label>
              <label class="swatch swatch--paper"><input type="radio" name="readingTheme" value="paper" /><span><svg class="icon" aria-hidden="true"><use href="#i-notes" /></svg>Paper</span></label>
            </div>
          </fieldset>

          <fieldset class="setting-group">
            <legend>Light or dark</legend>
            <div class="segmented">
              <label><input type="radio" name="theme" value="light" /><span>Light</span></label>
              <label><input type="radio" name="theme" value="dark" /><span>Dark</span></label>
              <label><input type="radio" name="theme" value="system" /><span>Device</span></label>
            </div>
          </fieldset>

          <fieldset class="setting-group">
            <legend>Font</legend>
            <div class="font-list">
              <label class="font-option"><input type="radio" name="font" value="opendyslexic" /><span class="font-name f-od">OpenDyslexic</span><span class="font-note">Made for dyslexia</span></label>
              <label class="font-option"><input type="radio" name="font" value="comic" /><span class="font-name f-comic">Comic Neue</span><span class="font-note">Rounded and friendly</span></label>
              <label class="font-option"><input type="radio" name="font" value="serif" /><span class="font-name f-serif">Book serif</span><span class="font-note">Georgia or your device’s serif</span></label>
              <label class="font-option"><input type="radio" name="font" value="system" /><span class="font-name f-system">Standard</span><span class="font-note">Your device's font</span></label>
            </div>
          </fieldset>

          <div class="setting-row">
            <label class="setting-label" for="set-bold">Bold text</label>
            <input type="checkbox" id="set-bold" name="bold" class="switch" role="switch" />
          </div>

          <div class="setting-row setting-row--range">
            <label class="setting-label" for="set-line">Line spacing <output id="set-line-out" for="set-line"></output></label>
            <input type="range" id="set-line" name="lineHeight" min="1.4" max="2.6" step="0.2" />
          </div>

          <div class="setting-row setting-row--range">
            <label class="setting-label" for="set-letter">Letter spacing <output id="set-letter-out" for="set-letter"></output></label>
            <input type="range" id="set-letter" name="letterSpacing" min="0" max="0.2" step="0.05" />
          </div>

          <div class="setting-row">
            <label class="setting-label" for="set-everywhere">Use this font in menus too</label>
            <input type="checkbox" id="set-everywhere" name="fontEverywhere" class="switch" role="switch" />
          </div>

          <div class="setting-row">
            <label class="setting-label" for="set-scroll">Follow along as it reads</label>
            <input type="checkbox" id="set-scroll" name="autoScroll" class="switch" role="switch" />
          </div>

          <p class="preview-line" aria-hidden="true">The quick brown fox jumps over the lazy dog.</p>
        </div>
        <div class="sheet-foot">
          <button type="button" class="btn btn--ghost" id="settings-reset">Reset</button>
          <button type="submit" class="btn btn--primary">Done</button>
        </div>
      </form>
    </dialog>

    <!-- Confirm -->
    <dialog id="confirm-dialog" class="sheet sheet--confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <form method="dialog">
        <div class="sheet-head"><h2 id="confirm-title"></h2></div>
        <div class="sheet-body"><p id="confirm-body"></p></div>
        <div class="sheet-foot">
          <button type="submit" class="btn btn--ghost" value="cancel" autofocus>Keep it</button>
          <button type="submit" class="btn btn--danger" value="confirm" id="confirm-ok">Delete</button>
        </div>
      </form>
    </dialog>

    <input type="file" id="global-file" accept=".pdf,.txt,application/pdf,text/plain" hidden />

    <noscript>
      <p class="noscript">Ôdēō needs JavaScript to read text aloud. Please turn it on and reload the page.</p>
    </noscript>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
