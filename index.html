<!doctype html>
<html lang="en" data-font="opendyslexic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ôdēō — Text to speech</title>
    <meta name="description" content="Ôdēō turns any text, PDF or TXT file into speech, with word-by-word highlighting and dyslexia-friendly reading settings." />
    <meta name="theme-color" content="#f3edff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#241c36" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <link rel="preload" href="fonts/OpenDyslexic-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script src="js/theme-boot.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <!-- Icon sprite -->
    <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
      <symbol id="i-logo" viewBox="0 0 24 24"><path d="M5 14v4M10 9v9M15 5v13M20 11v7" /></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5M9 13h6M9 17h6M9 9h2" /></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" /></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 4.6l3.8-1 3.2 15.5-3.8 1z" transform="translate(-1 0)" /></symbol>
      <symbol id="i-a11y" viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.8" /><path d="M5 8.5l7 1.5 7-1.5M12 10v4.5M12 14.5L8.5 21M12 14.5l3.5 6.5" /></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="currentColor" stroke="none" /></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M11 18l-7-6 7-6zM20 18l-7-6 7-6z" /></symbol>
      <symbol id="i-forward" viewBox="0 0 24 24"><path d="M13 18l7-6-7-6zM4 18l7-6-7-6z" /></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M15 3v5h5" /></symbol>
      <symbol id="i-note-plus" viewBox="0 0 24 24"><path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M15 3v5h5M12 11v6M9 14h6" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4-4" /></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" /></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2" /><path d="M4 10h16M8 3v4M16 3v4" /></symbol>
      <symbol id="i-comment" viewBox="0 0 24 24"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z" /></symbol>
      <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 12.5a10 10 0 0 1 4.2-2.4M19 12.5a10 10 0 0 0-2.8-1.9M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 11 5M12 20h.01" /></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2zM12 6.5v13" /></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" /><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" /></symbol>
    </svg>

    <header class="topbar">
      <button type="button" class="icon-btn menu-open" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <svg class="icon" aria-hidden="true"><use href="#i-menu" /></svg>
      </button>
      <a class="brand" href="#/text">
        <svg class="icon" aria-hidden="true"><use href="#i-logo" /></svg>
        <span class="brand-name">Ôdēō</span>
      </a>
      <button type="button" class="icon-btn settings-open" aria-label="Reading settings" aria-haspopup="dialog">
        <svg class="icon" aria-hidden="true"><use href="#i-a11y" /></svg>
      </button>
    </header>

    <div class="app">
      <aside id="sidebar" class="sidebar" aria-label="Sidebar">
        <div class="sidebar-head">
          <a class="brand" href="#/text">
            <svg class="icon" aria-hidden="true"><use href="#i-logo" /></svg>
            <span class="brand-name">Ôdēō</span>
          </a>
          <button type="button" class="icon-btn settings-open" aria-label="Reading settings" aria-haspopup="dialog">
            <svg class="icon" aria-hidden="true"><use href="#i-a11y" /></svg>
          </button>
          <button type="button" class="icon-btn sidebar-close" aria-label="Close menu">
            <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
          </button>
        </div>

        <nav class="nav" aria-label="Main">
          <ul>
            <li>
              <a href="#/text" data-route="text">
                <svg class="icon" aria-hidden="true"><use href="#i-text" /></svg>
                <span>Text to Speech</span>
              </a>
            </li>
            <li>
              <a href="#/file" data-route="file">
                <svg class="icon" aria-hidden="true"><use href="#i-upload" /></svg>
                <span>File to Speech</span>
              </a>
            </li>
            <li>
              <a href="#/library" data-route="library">
                <svg class="icon" aria-hidden="true"><use href="#i-book" /></svg>
                <span>My library</span>
              </a>
            </li>
          </ul>
        </nav>

        <section class="recents" aria-labelledby="recents-heading">
          <h2 id="recents-heading">Recents</h2>
          <div id="recents"></div>
        </section>
      </aside>

      <div class="backdrop" hidden></div>

      <main id="main" class="main" tabindex="-1"></main>
    </div>

    <div class="offline-banner" id="offline-banner" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-wifi-off" /></svg>
      <span>You're offline. Saved items still play with on-device voices.</span>
    </div>

    <!-- Screen reader announcements -->
    <div id="announcer-polite" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="announcer-assertive" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <!-- Visible toast messages -->
    <div class="toasts" id="toasts"></div>

    <!-- Reading settings -->
    <dialog id="settings-dialog" class="dialog dialog--side" aria-labelledby="settings-title">
      <form method="dialog" class="dialog-inner" id="settings-form">
        <div class="dialog-head">
          <h2 id="settings-title">Reading settings</h2>
          <button type="submit" class="icon-btn" aria-label="Close settings" value="close">
            <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
          </button>
        </div>
        <div class="dialog-body">
          <fieldset class="field-group">
            <legend>Font</legend>
            <div class="choice-list">
              <label class="choice"><input type="radio" name="font" value="opendyslexic" /><span class="choice-label font-sample-od">OpenDyslexic</span></label>
              <label class="choice"><input type="radio" name="font" value="comic" /><span class="choice-label font-sample-comic">Comic Sans</span></label>
              <label class="choice"><input type="radio" name="font" value="system" /><span class="choice-label font-sample-system">Standard</span></label>
            </div>
          </fieldset>

          <div class="field">
            <label for="set-size">Text size <output id="set-size-out" for="set-size"></output></label>
            <input type="range" id="set-size" name="fontSize" min="16" max="36" step="2" />
          </div>

          <div class="field">
            <label for="set-line">Line spacing <output id="set-line-out" for="set-line"></output></label>
            <input type="range" id="set-line" name="lineHeight" min="1.4" max="2.6" step="0.2" />
          </div>

          <div class="field">
            <label for="set-letter">Letter spacing <output id="set-letter-out" for="set-letter"></output></label>
            <input type="range" id="set-letter" name="letterSpacing" min="0" max="0.2" step="0.05" />
          </div>

          <fieldset class="field-group">
            <legend>Theme</legend>
            <div class="segmented">
              <label><input type="radio" name="theme" value="system" /><span>System</span></label>
              <label><input type="radio" name="theme" value="light" /><span>Light</span></label>
              <label><input type="radio" name="theme" value="dark" /><span>Dark</span></label>
            </div>
          </fieldset>

          <div class="field">
            <label for="set-voice">Voice</label>
            <select id="set-voice" name="voiceURI" aria-describedby="set-voice-hint"></select>
            <p class="hint" id="set-voice-hint">Voices marked "online" need an internet connection.</p>
          </div>

          <div class="field">
            <label for="set-rate">Reading speed <output id="set-rate-out" for="set-rate"></output></label>
            <input type="range" id="set-rate" name="rate" min="0.5" max="2" step="0.1" />
          </div>

          <label class="check">
            <input type="checkbox" name="autoScroll" />
            <span>Keep the word being read in view</span>
          </label>

          <div class="preview-box" aria-label="Preview">
            <p class="reading-text">The quick brown fox jumps over the lazy dog.</p>
            <button type="button" class="btn btn--secondary" id="voice-test">
              <svg class="icon" aria-hidden="true"><use href="#i-volume" /></svg>
              Test voice
            </button>
          </div>
        </div>
        <div class="dialog-foot">
          <button type="button" class="btn btn--ghost" id="settings-reset">Reset to defaults</button>
          <button type="submit" class="btn btn--primary" value="close">Done</button>
        </div>
      </form>
    </dialog>

    <!-- Confirm dialog -->
    <dialog id="confirm-dialog" class="dialog dialog--center" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <form method="dialog" class="dialog-inner">
        <div class="dialog-head"><h2 id="confirm-title"></h2></div>
        <div class="dialog-body"><p id="confirm-body"></p></div>
        <div class="dialog-foot">
          <button type="submit" class="btn btn--ghost" value="cancel" autofocus>Cancel</button>
          <button type="submit" class="btn btn--danger" value="confirm" id="confirm-ok">Delete</button>
        </div>
      </form>
    </dialog>

    <noscript>
      <p class="noscript">Ôdēō needs JavaScript to read text aloud. Please turn it on and reload the page.</p>
    </noscript>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
